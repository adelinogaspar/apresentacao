<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620">
  <style>
    text{font-family:"Inter","Segoe UI",system-ui,sans-serif}
    .ttl{font-size:22px;font-weight:800;letter-spacing:.14em;fill:#ffb347}
    .lab{font-size:17px;font-weight:700;fill:#f7f1e8}
    .sub{font-size:13px;fill:#a99b8c}
    .tag{font-size:13px;font-weight:700;letter-spacing:.1em;fill:#ff7a00}
    .box{fill:rgba(255,122,0,.07);stroke:#ff7a00;stroke-width:2}
    .chip{fill:rgba(255,122,0,.16);stroke:#ff7a00;stroke-width:1.5}
    .arrow{stroke:#ff7a00;stroke-width:2;fill:none}
    .dash{stroke:#ffb347;stroke-width:2;fill:none;stroke-dasharray:6 5}
  </style>

  <rect width="1080" height="620" fill="#080605"/>

  <!-- títulos -->
  <text class="ttl" x="60" y="42">THREAD DE PLATAFORMA</text>
  <text class="ttl" x="600" y="42">THREAD VIRTUAL</text>
  <line x1="540" y1="20" x2="540" y2="560" stroke="rgba(255,122,0,.25)" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- coluna esquerda -->
  <g>
    <rect class="box" x="60" y="66" width="420" height="50" rx="10"/>
    <text class="lab" x="80" y="92">1 tarefa / request</text>
    <rect class="box" x="60" y="140" width="420" height="50" rx="10"/>
    <text class="lab" x="80" y="166">1 objeto Thread</text>
    <text class="sub" x="80" y="182">criar é caro, cada uma custa ~1 MB</text>
    <rect class="box" x="60" y="214" width="420" height="50" rx="10"/>
    <text class="lab" x="80" y="240">1 thread do sistema operacional</text>
    <text class="sub" x="80" y="256">relação 1 : 1 com o SO</text>
    <rect class="box" x="60" y="288" width="420" height="50" rx="10"/>
    <text class="lab" x="80" y="314">stack de 1 MB reservado</text>
    <text class="sub" x="80" y="330">empilhar = esgotar memória</text>
    <rect class="box" x="60" y="362" width="420" height="50" rx="10"/>
    <text class="lab" x="80" y="388">núcleo do CPU</text>
    <path class="arrow" d="M270 116 L270 140 M264 134 L270 140 L276 134"/>
    <path class="arrow" d="M270 190 L270 214 M264 208 L270 214 L276 208"/>
    <path class="arrow" d="M270 264 L270 288 M264 282 L270 288 L276 282"/>
    <path class="arrow" d="M270 338 L270 362 M264 356 L270 362 L276 356"/>
    <text class="tag" x="60" y="450">LIMITE: MILHARES DE THREADS</text>
  </g>

  <!-- coluna direita -->
  <g>
    <rect class="box" x="600" y="66" width="420" height="50" rx="10"/>
    <text class="lab" x="620" y="92">10.000+ threads virtuais</text>
    <text class="sub" x="620" y="108">baratas: ~100 bytes, criadas sob demanda</text>
    <g>
      <rect class="chip" x="860" y="76" width="22" height="12" rx="3"/>
      <rect class="chip" x="888" y="76" width="22" height="12" rx="3"/>
      <rect class="chip" x="916" y="76" width="22" height="12" rx="3"/>
      <rect class="chip" x="944" y="76" width="22" height="12" rx="3"/>
      <rect class="chip" x="972" y="76" width="22" height="12" rx="3"/>
    </g>
    <rect class="box" x="600" y="140" width="420" height="50" rx="10"/>
    <text class="lab" x="620" y="166">stack em pedaços no heap</text>
    <text class="sub" x="620" y="182">continuations: cresce só o necessário</text>
    <rect class="box" x="600" y="214" width="420" height="50" rx="10"/>
    <text class="lab" x="620" y="240">carrier threads (ForkJoinPool)</text>
    <text class="sub" x="620" y="256">monta / desmonta quando bloqueia</text>
    <rect class="box" x="600" y="288" width="420" height="50" rx="10"/>
    <text class="lab" x="620" y="314">poucas threads do sistema operacional</text>
    <text class="sub" x="620" y="330">N : 1 — muitas virtuais por carrier</text>
    <rect class="box" x="600" y="362" width="420" height="50" rx="10"/>
    <text class="lab" x="620" y="388">núcleo do CPU</text>
    <path class="arrow" d="M810 116 L810 140 M804 134 L810 140 L816 134"/>
    <path class="arrow" d="M810 190 L810 214 M804 208 L810 214 L816 208"/>
    <path class="arrow" d="M810 264 L810 288 M804 282 L810 288 L816 282"/>
    <path class="arrow" d="M810 338 L810 362 M804 356 L810 362 L816 356"/>
    <text class="tag" x="600" y="450">LIMITE: MILHÕES DE THREADS</text>
  </g>

  <!-- chips representando várias threads virtuais -->
  <g>
    <rect class="chip" x="110" y="470" width="160" height="90" rx="12"/>
    <text class="tag" x="130" y="494">1 thread</text>
    <text class="sub" x="130" y="513">= 1 thread do SO</text>
    <text class="sub" x="130" y="532">= 1 MB de stack</text>
    <text class="sub" x="130" y="551">= sempre "viva"</text>

    <rect class="chip" x="730" y="470" width="230" height="90" rx="12"/>
    <text class="tag" x="750" y="494">N threads virtuais</text>
    <text class="sub" x="750" y="513">= 1 carrier thread</text>
    <text class="sub" x="750" y="532">= stack no heap, sob demanda</text>
    <text class="sub" x="750" y="551">= dorme quando bloqueia</text>

    <text class="sub" x="540" y="592" text-anchor="middle">Project Loom · JEP 444 (final no Java 21) · Java 25 LTS: Structured Concurrency e Scoped Values</text>
  </g>
</svg>
