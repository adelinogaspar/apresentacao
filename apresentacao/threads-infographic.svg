<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" width="1180" height="640">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff3d00"/>
    </linearGradient>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 1L8 5L0 9" fill="none" stroke="#ff7a00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1180" height="640" fill="#070606" rx="14"/>

  <!-- separador central -->
  <line x1="590" y1="24" x2="590" y2="616" stroke="rgba(255,122,0,.28)" stroke-width="2" stroke-dasharray="6 7"/>
  <circle cx="590" cy="320" r="26" fill="#070606" stroke="#ff7a00" stroke-width="2"/>
  <text x="590" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffb347">VS</text>

  <!-- ================= LEFT: plataforma ================= -->
  <text x="300" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#ff7a00" letter-spacing="2">THREAD DE PLATAFORMA</text>
  <text x="300" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#a99b8c">1 thread Java = 1 thread do sistema (1:1)</text>

  <rect x="150" y="90" width="300" height="62" rx="10" fill="rgba(255,122,0,.10)" stroke="#ff7a00" stroke-width="2"/>
  <text x="300" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#f7f1e8">Objeto Thread (Java)</text>

  <line x1="300" y1="152" x2="300" y2="176" stroke="#ff7a00" stroke-width="2" marker-end="url(#arw)"/>

  <rect x="150" y="178" width="300" height="62" rx="10" fill="rgba(255,122,0,.10)" stroke="#ff7a00" stroke-width="2"/>
  <text x="300" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#f7f1e8">Thread nativa do SO</text>
  <text x="300" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#a99b8c">stack de 1–2 MB reservado</text>

  <line x1="300" y1="240" x2="300" y2="264" stroke="#ff7a00" stroke-width="2" marker-end="url(#arw)"/>

  <rect x="150" y="266" width="300" height="62" rx="10" fill="rgba(255,122,0,.10)" stroke="#ff7a00" stroke-width="2"/>
  <text x="300" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#f7f1e8">Núcleo da CPU</text>
  <text x="300" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#a99b8c">uma por vez, bloqueada em I/O</text>

  <!-- mini ilustração: muitas threads pesadas -->
  <g>
    <rect x="150" y="352" width="300" height="110" rx="10" fill="rgba(255,61,0,.07)" stroke="rgba(255,122,0,.25)" stroke-width="1.5"/>
    <text x="300" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#a99b8c">limite prático: centenas de threads</text>
    <rect x="168" y="386" width="104" height="60" rx="8" fill="url(#grad)" opacity=".55"/>
    <rect x="280" y="386" width="104" height="60" rx="8" fill="url(#grad)" opacity=".35"/>
    <text x="220" y="421" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#070606">2 MB</text>
    <text x="332" y="421" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#f7f1e8">2 MB</text>
  </g>

  <text x="300" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ff7a00">caro e limitado</text>
  <text x="300" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#a99b8c">cada thread espera I/O parada, ocupando memória</text>

  <!-- badge 1:1 -->
  <rect x="256" y="546" width="88" height="30" rx="15" fill="rgba(255,122,0,.12)" stroke="#ff7a00" stroke-width="1.5"/>
  <text x="300" y="566" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffb347">1 : 1</text>

  <!-- ================= RIGHT: virtual ================= -->
  <text x="880" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#ffb347" letter-spacing="2">THREAD VIRTUAL (Java 21+)</text>
  <text x="880" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#a99b8c">milhares de threads leves sobre poucas threads reais (M:N)</text>

  <rect x="730" y="90" width="300" height="120" rx="10" fill="rgba(255,179,71,.10)" stroke="#ffb347" stroke-width="2"/>
  <text x="880" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#f7f1e8">Fila de threads virtuais</text>
  <!-- pontinhos: muitas threads leves -->
  <g fill="#ffb347">
    <circle cx="746" cy="134" r="4"/><circle cx="762" cy="142" r="4"/><circle cx="778" cy="128" r="4"/><circle cx="794" cy="146" r="4"/><circle cx="810" cy="132" r="4"/><circle cx="826" cy="150" r="4"/><circle cx="842" cy="136" r="4"/><circle cx="858" cy="126" r="4"/><circle cx="874" cy="148" r="4"/><circle cx="890" cy="134" r="4"/><circle cx="906" cy="142" r="4"/><circle cx="922" cy="128" r="4"/><circle cx="938" cy="146" r="4"/><circle cx="954" cy="132" r="4"/><circle cx="970" cy="150" r="4"/><circle cx="986" cy="138" r="4"/><circle cx="754" cy="162" r="4"/><circle cx="770" cy="170" r="4"/><circle cx="786" cy="158" r="4"/><circle cx="802" cy="166" r="4"/><circle cx="818" cy="160" r="4"/><circle cx="834" cy="172" r="4"/><circle cx="850" cy="164" r="4"/><circle cx="866" cy="176" r="4"/><circle cx="882" cy="158" r="4"/><circle cx="898" cy="170" r="4"/><circle cx="914" cy="162" r="4"/><circle cx="930" cy="174" r="4"/><circle cx="946" cy="160" r="4"/><circle cx="962" cy="172" r="4"/><circle cx="978" cy="164" r="4"/><circle cx="994" cy="170" r="4"/>
  </g>

  <line x1="880" y1="210" x2="880" y2="234" stroke="#ffb347" stroke-width="2" marker-end="url(#arw)"/>

  <rect x="730" y="236" width="300" height="62" rx="10" fill="rgba(255,179,71,.10)" stroke="#ffb347" stroke-width="2"/>
  <text x="880" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#f7f1e8">Scheduler da JVM</text>
  <text x="880" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#a99b8c">continuations guardadas na heap (~300 B)</text>

  <line x1="880" y1="298" x2="880" y2="322" stroke="#ffb347" stroke-width="2" marker-end="url(#arw)"/>

  <rect x="730" y="324" width="300" height="62" rx="10" fill="rgba(255,179,71,.10)" stroke="#ffb347" stroke-width="2"/>
  <text x="880" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#f7f1e8">Pool de threads de plataforma</text>
  <text x="880" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#a99b8c">poucas, reaproveitadas</text>

  <line x1="880" y1="386" x2="880" y2="410" stroke="#ffb347" stroke-width="2" marker-end="url(#arw)"/>

  <rect x="730" y="412" width="300" height="62" rx="10" fill="rgba(255,179,71,.10)" stroke="#ffb347" stroke-width="2"/>
  <text x="880" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#f7f1e8">Núcleo da CPU</text>
  <text x="880" y="466" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#a99b8c">a virtual sai de cena quando espera I/O</text>

  <text x="880" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ffb347">barato e abundante</text>
  <text x="880" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#a99b8c">milhões de threads sem estourar a memória</text>

  <rect x="836" y="546" width="88" height="30" rx="15" fill="rgba(255,179,71,.14)" stroke="#ffb347" stroke-width="1.5"/>
  <text x="880" y="566" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffb347">M : N</text>

  <text x="590" y="616" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6f6358">Java 25 — threads virtuais: mesma API de Thread, muito mais concurrency</text>
</svg>
